<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador - Brooklyn Logística</title>
    
    <!-- Configuración PWA y Colores Corporativos (Azul BK) -->
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen pb-12">

    <!-- Header / Logo Institucional -->
    <header class="bg-[#121212] border-b border-blue-600/30 py-4 px-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <!-- Simulación visual rápida del isotipo BK en el header -->
                <div class="w-9 h-9 rounded-xl bg-black border border-blue-500/50 flex items-center justify-center font-extrabold text-sm tracking-tighter shadow">
                    <span class="text-white">B</span><span class="text-blue-500">K</span>
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wider text-white">BROOKLYN <span class="text-blue-500">LOGÍSTICA</span></h1>
                    <p class="text-[10px] text-gray-400">Simulador de Cotizaciones</p>
                </div>
            </div>
            <button onclick="resetForm()" class="text-xs bg-gray-800 hover:bg-gray-700 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-lg transition">
                🔄 Limpiar
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Panel de Tarifas Editables -->
        <section class="bg-[#161616] border border-gray-800 rounded-2xl p-4 shadow-md">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">⚙️ Tarifas Vigentes (Editables)</h2>
                <span class="text-[10px] text-gray-400">Toca para modificar</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="bg-[#1f1f1f] p-2 rounded-xl border border-gray-800">
                    <label class="text-gray-400 block text-[10px]">Mínimo 2hs ($)</label>
                    <input type="number" id="p_base" value="180000" oninput="calcular()" class="w-full bg-transparent font-bold text-blue-400 text-sm focus:outline-none">
                </div>
                <div class="bg-[#1f1f1f] p-2 rounded-xl border border-gray-800">
                    <label class="text-gray-400 block text-[10px]">Hora Adicional ($)</label>
                    <input type="number" id="p_hora" value="100000" oninput="calcular()" class="w-full bg-transparent font-bold text-blue-400 text-sm focus:outline-none">
                </div>
                <div class="bg-[#1f1f1f] p-2 rounded-xl border border-gray-800">
                    <label class="text-gray-400 block text-[10px]">Ayudante / Hora ($)</label>
                    <input type="number" id="p_ayudante" value="20000" oninput="calcular()" class="w-full bg-transparent font-bold text-blue-400 text-sm focus:outline-none">
                </div>
                <div class="bg-[#1f1f1f] p-2 rounded-xl border border-gray-800">
                    <label class="text-gray-400 block text-[10px]">Bulto Liviano x Piso ($)</label>
                    <input type="number" id="p_liviano" value="6500" oninput="calcular()" class="w-full bg-transparent font-bold text-blue-400 text-sm focus:outline-none">
                </div>
                <div class="col-span-2 bg-[#1f1f1f] p-2 rounded-xl border border-gray-800">
                    <label class="text-gray-400 block text-[10px]">Bulto Pesado x Piso ($)</label>
                    <input type="number" id="p_pesado" value="8500" oninput="calcular()" class="w-full bg-transparent font-bold text-blue-400 text-sm focus:outline-none">
                </div>
            </div>
        </section>

        <!-- Tiempos y Personal -->
        <section class="bg-[#161616] border border-gray-800 rounded-2xl p-4 shadow-md space-y-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">⏱️ Tiempos y Personal</h2>
            
            <div>
                <label class="text-xs text-gray-300 block mb-1">Duración estimada del servicio (Horas)</label>
                <div class="flex items-center space-x-2">
                    <input type="number" id="horas" value="2" min="1" step="0.5" oninput="calcular()" class="w-full bg-[#1f1f1f] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-blue-500 focus:outline-none">
                    <span class="text-xs text-gray-400">hs (Mín. 2)</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-1">
                <div>
                    <label class="text-xs text-gray-300 block mb-1">Cantidad de Ayudantes</label>
                    <input type="number" id="ayudantes_cant" value="1" min="0" step="1" oninput="calcular()" class="w-full bg-[#1f1f1f] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-300 block mb-1">Pisos por escalera</label>
                    <input type="number" id="pisos" value="0" min="0" step="1" oninput="calcular()" class="w-full bg-[#1f1f1f] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold text-center focus:border-blue-500 focus:outline-none">
                </div>
            </div>
        </section>

        <!-- Bultos y Objetos -->
        <section class="bg-[#161616] border border-gray-800 rounded-2xl p-4 shadow-md space-y-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">📦 Bultos y Escaleras</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#1f1f1f] p-2.5 rounded-xl border border-gray-800">
                    <label class="text-xs text-gray-300 block mb-1">Bultos Livianos</label>
                    <input type="number" id="bultos_livianos" value="0" min="0" oninput="calcular()" class="w-full bg-black/40 border border-gray-700 rounded-lg p-1.5 text-center font-bold text-white">
                </div>
                <div class="bg-[#1f1f1f] p-2.5 rounded-xl border border-gray-800">
                    <label class="text-xs text-gray-300 block mb-1">Bultos Pesados</label>
                    <input type="number" id="bultos_pesados" value="0" min="0" oninput="calcular()" class="w-full bg-black/40 border border-gray-700 rounded-lg p-1.5 text-center font-bold text-white">
                </div>
            </div>
        </section>

        <!-- Resultado y Presupuesto Total -->
        <section class="bg-gradient-to-br from-[#141414] to-[#0d0d0d] border-2 border-blue-600 rounded-2xl p-5 shadow-xl text-center space-y-3">
            <h3 class="text-xs font-bold tracking-widest text-gray-400 uppercase">Presupuesto Total Estimado</h3>
            <div id="total_presupuesto" class="text-3xl font-extrabold text-blue-400 tracking-tight">$180.000</div>
            
            <div id="detalle_resumen" class="text-left text-xs text-gray-300 bg-black/50 p-3 rounded-xl space-y-1 border border-gray-800">
                <!-- Se llena con JS -->
            </div>

            <button onclick="enviarWhatsApp()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                <span>💬 Enviar Presupuesto por WhatsApp</span>
            </button>
        </section>

    </main>

    <script>
        function calcular() {
            let p_base = parseFloat(document.getElementById('p_base').value) || 0;
            let p_hora = parseFloat(document.getElementById('p_hora').value) || 0;
            let p_ayudante = parseFloat(document.getElementById('p_ayudante').value) || 0;
            let p_liviano = parseFloat(document.getElementById('p_liviano').value) || 0;
            let p_pesado = parseFloat(document.getElementById('p_pesado').value) || 0;

            let horas = parseFloat(document.getElementById('horas').value) || 2;
            if (horas < 2) horas = 2;

            let ayudantes_cant = parseInt(document.getElementById('ayudantes_cant').value) || 0;
            let pisos = parseInt(document.getElementById('pisos').value) || 0;
            let bultos_livianos = parseInt(document.getElementById('bultos_livianos').value) || 0;
            let bultos_pesados = parseInt(document.getElementById('bultos_pesados').value) || 0;

            let costo_traslado = p_base;
            if (horas > 2) {
                costo_traslado += (horas - 2) * p_hora;
            }

            let costo_ayudantes = p_ayudante * ayudantes_cant * horas;
            let costo_escalera_livianos = pisos * bultos_livianos * p_liviano;
            let costo_escalera_pesados = pisos * bultos_pesados * p_pesado;
            let costo_total_bultos_piso = costo_escalera_livianos + costo_escalera_pesados;

            let total = costo_traslado + costo_ayudantes + costo_total_bultos_piso;

            let formatoArg = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
            document.getElementById('total_presupuesto').innerText = formatoArg.format(total);

            let detalleHTML = `<div>🚚 <b>Traslado (${horas} hs):</b> ${formatoArg.format(costo_traslado)}</div>`;
            if (ayudantes_cant > 0) {
                detalleHTML += `<div>👥 <b>Ayudantes (${ayudantes_cant} pers x ${horas}hs):</b> ${formatoArg.format(costo_ayudantes)}</div>`;
            }
            if (pisos > 0 && (bultos_livianos > 0 || bultos_pesados > 0)) {
                detalleHTML += `<div>📦 <b>Adicional por pisos (${pisos} pisos):</b> ${formatoArg.format(costo_total_bultos_piso)}</div>`;
            }
            document.getElementById('detalle_resumen').innerHTML = detalleHTML;
        }

        function enviarWhatsApp() {
            let total = document.getElementById('total_presupuesto').innerText;
            let horas = document.getElementById('horas').value;
            let ayudantes = document.getElementById('ayudantes_cant').value;
            let pisos = document.getElementById('pisos').value;

            let mensaje = `*BROOKLYN LOGÍSTICA* - Presupuesto Estimado:\n\n` +
                          `⏱️ Duración: ${horas} hs\n` +
                          `👥 Ayudantes: ${ayudantes}\n` +
                          `🏢 Pisos por escalera: ${pisos}\n\n` +
                          `💰 *TOTAL A ABONAR: ${total}*\n\n` +
                          `_¡Llevamos lo que necesitás, a donde lo necesitás!_`;

            let url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        function resetForm() {
            document.getElementById('horas').value = 2;
            document.getElementById('ayudantes_cant').value = 1;
            document.getElementById('pisos').value = 0;
            document.getElementById('bultos_livianos').value = 0;
            document.getElementById('bultos_pesados').value = 0;
            calcular();
        }

        window.onload = calcular;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }
    </script>
</body>
</html>
